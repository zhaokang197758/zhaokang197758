name: daily-signal

on:
  # 定时不靠 GitHub 自己的 cron：实测会延迟 54 分钟以上，收盘后才推送等于废信号。
  # 改由外部定时服务（WorkBuddy 定时任务）按点调用下面这个 dispatch 接口。
  workflow_dispatch:
    inputs:
      mode:
        description: "morning=早盘 / close=收盘，留空按当前时间自动判断"
        required: false
        default: ""

concurrency:
  group: daily-signal      # 固定组：外部触发的与备份定时器互斥，避免同时扫 800 只
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 只要两个包：akshare 已不需要（股票池读固化名单），装它会白等一分半
      - name: 安装依赖
        run: pip install -q pandas requests

      - name: 生成信号并推送
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          MODE: ${{ github.event.inputs.mode }}
          CRON: ${{ github.event.schedule }}
        run: python strategy.py
