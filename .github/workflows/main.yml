name: daily-signal

on:
  schedule:
    - cron: "15 6 * * 1-5"
  workflow_dispatch:

concurrency:
  group: daily-signal
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -q pandas requests && (pip install -q akshare || echo "akshare 不可用，走固化名单")

      - name: 生成信号并推送
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python strategy.py
