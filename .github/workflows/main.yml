name: daily-signal

on:
  schedule:
    - cron: "0 2 * * 1-5"     # 北京 10:00 早盘：持仓该不该卖
    - cron: "30 6 * * 1-5"    # 北京 14:30 收盘：选股 + 持仓诊断（备份通道，正常由定时任务触发）
  workflow_dispatch:
    inputs:
      mode:
        description: "morning=早盘 / close=收盘，留空按当前时间自动判断"
        required: false
        default: ""

concurrency:
  group: daily-signal      # 固定组：外部触发的与备份定时器互斥，避免同时扫 800 只
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 只要两个包：akshare 已不需要（股票池读固化名单），装它会白等一分半
      - name: 安装依赖
        run: pip install -q pandas requests

      - name: 生成信号并推送
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          MODE: ${{ github.event.inputs.mode }}
          CRON: ${{ github.event.schedule }}
        run: python strategy.py
