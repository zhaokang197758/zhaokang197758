name: daily-signal

on:
  schedule:
    - cron: "52 1 * * 1-5"    # 北京 09:52 早盘：判断持仓该不该卖
    - cron: "15 6 * * 1-5"    # 北京 14:15 收盘：选股 + 持仓诊断
  workflow_dispatch:
    inputs:
      mode:
        description: "morning=早盘 / close=收盘，留空按当前时间自动判断"
        required: false
        default: ""

concurrency:
  group: daily-signal-${{ github.event.schedule }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -q pandas requests && (pip install -q akshare || echo "akshare 不可用，走固化名单")

      - name: 生成信号并推送
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          MODE: ${{ github.event.inputs.mode }}
        run: python strategy.py
